name: Deploy raiOS Pages

on:
  push:
    branches:
      - website
    paths:
      - raios-ui-lab.html
      - ui-lab/**
      - cloudflare/pages-worker.mjs
      - scripts/build-pages-site.ps1
      - .github/workflows/deploy-raios-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raios-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            | tar --extract --gzip --strip-components=1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build public site
        shell: pwsh
        env:
          RAIOS_BUILD_VERSION: ${{ github.sha }}
        run: ./scripts/build-pages-site.ps1 -BuildVersion $env:RAIOS_BUILD_VERSION

      - name: Deploy production site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.112.0 pages deploy pages-dist --project-name raios-site --branch website
