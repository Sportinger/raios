2,48,120],[0,0,59,110,102,6,15,0],[0,0,62,3,30,48,31,0],[8,12,62,12,12,44,24,0],[0,0,51,51,51,51,110,0],[0,0,51,51,51,30,12,0],[0,0,99,107,127,127,54,0],[0,0,99,54,28,54,99,0],[0,0,51,51,51,62,48,31],[0,0,63,25,12,38,63,0],[56,12,12,7,12,12,56,0],[24,24,24,0,24,24,24,0],[7,12,12,56,12,12,7,0],[110,59,0,0,0,0,0,0],[54,0,30,48,62,51,110,0],[54,0,30,51,51,51,30,0],[54,0,51,51,51,51,110,0],[54,12,30,51,63,51,51,0],[54,28,54,99,99,54,28,0],[54,51,51,51,51,51,63,0],[30,51,51,31,51,51,31,3]];
const UMLAUT = { "ä":95, "ö":96, "ü":97, "Ä":98, "Ö":99, "Ü":100, "ß":101 };
const SCALE = 2, ADV = 9, ROW_H = 12;

// genesis_layout.rs für 1280x800 (logisch 640x400)
const L = {

const PAL = {
  DREAM_BG:    "#0B0C0E",
  APP_BG:      "#14161A",
  SURFACE_BG:  "#1D2026",
  SURFACE_ALT: "#272B33",

};

// Mauszeiger-Form aus genesis.rs draw_current_cursor (X = Rand, O = Fuellung)
const POINTER_SHAPE = [
  "X", "XX", "XOX", "XOOX", "XOOOX", "XOOOOX", "XOOOOOX", "XOOOOOOX",
  "XOOOOOOOX", "XOOOOX", "XOOXOX", "XOXXOX", "XX  XOX", "X    XOX", "     XOX", "      X",
];
const POINTER_OUTLINE = "#05080C";

const state = {
  dream: true,                // Traum-Layout (Design-Vorschlag); ?classic=1 -> originalgetreue Genesis
  dreamTab: "chat",           // chat | console | build
  buildB: 34,                 // Sim: Doppel-Bau, Lauf B in Prozent
  approved: false,

  pointer: null,              // physische Canvas-Koordinaten
  pointerDown: false,
  composerFocus: false,
  composerText: "",
  cursorOn: true,
  pressed: null,
  recoveryOpen: false,
  keyboardLayout: "US",
  chat: [],                   // {speaker: "user"|"assistant"|"system", text}
  chatScroll: 0,
  wifiNetworks: [             // Sim-Daten im echten scan_line-Format
    { ssid: "home-fiber-5G", ch: 36, sec: "WPA2", tag: "scan" },

  ],

  wifiConnected: false,
  overlayAnim: 1,             // 0..1 beim Oeffnen (Sim-Erfindung)
};
let hits = [];

const cv = document.getElementById("screen");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

// Zwei-Ebenen-Modell wie framebuffer.rs: Szene -> Back-Buffer (teuer, nur bei
// Zustandsaenderung), Cursor/Pointer -> Front-Pixel obendrauf (billig, ohne
// Neuzeichnen der Szene; Kernel: set_front_pixel + restore_from_back_rect).
const back = document.createElement("canvas");
back.width = cv.width;
back.height = cv.height;
const bctx = back.getContext("2d");
bctx.imageSmoothingEnabled = false;
let target = bctx;

function fillRect(x, y, w, h, col) {
  if (w <= 0 || h <= 0) return;
  target.fillStyle = PAL[col] || col;
  target.fillRect(Math.round(x) * SCALE, Math.round(y) * SCALE, Math.round(w) * SCALE, Math.round(h) * SCALE);
}

function glyphIndex(ch) {
  const c = ch.codePointAt(0);
  if (c >= 32 && c <= 126) return c - 32;
  if (ch in UMLAUT) return UMLAUT[ch];
  return 0;
}

function drawText(x, y, str, col) {
  target.fillStyle = PAL[col] || col;
  let px = x * SCALE;
  for (const ch of str) {
    const g = FONT8X8[glyphIndex(ch)];
    for (let row = 0; row < 8; row++) {
      const bits = g[row];
      for (let c = 0; c < 8; c++) {
        if ((bits >> c) & 1) target.fillRect(px + c * SCALE, (y + row) * SCALE, SCALE, SCALE);
      }
    }
    px += ADV * SCALE;
  }
}

function textWidth(str) { return [...str].length * ADV; }

// Physisch aufgeloester Text: dieselben 8x8-Bitmaps, aber 1 physisches Pixel
// pro Fontpixel (Kernel-Aequivalent: set_physical_pixel) — halbe Groesse,
// doppelte Schaerfe, weniger Pixel-Schreibarbeit als der 2x-Pfad.
function drawTextHi(x, y, str, col) {
  target.fillStyle = PAL[col] || col;
  let px = Math.round(x * SCALE);
  const py = Math.round(y * SCALE);
  for (const ch of str) {
    const g = FONT8X8[glyphIndex(ch)];
    for (let row = 0; row < 8; row++) {
      const bits = g[row];
      for (let c = 0; c < 8; c++) {
        if ((bits >> c) & 1) target.fillRect(px + c, py + row, 1, 1);
      }
    }
    px += 9;
  }
}

function drawTruncated(x, y, str, maxChars, col) {
  const chars = [...str];
  if (chars.length <= maxChars) { drawText(x, y, str, col); return; }
  if (maxChars < 4) return;
  drawText(x, y, chars.slice(0, maxChars - 3).join(""), col);
  drawText(x + (maxChars - 3) * ADV, y, "...", col);
}

function drawOutline(r, col) {
  fillRect(r.x, r.y, r.w, 1, col);
  fillRect(r.x, r.y + r.h - 1, r.w, 1, col);
  fillRect(r.x, r.y, 1, r.h, col);
  fillRect(r.x + r.w - 1, r.y, 1, r.h, col);
}

function drawPanel(r, title) {
  fillRect(r.x, r.y, r.w, r.h, "SURFACE_BG");
  drawOutline(r, "HAIRLINE");
  drawText(r.x + 14, r.y + 16, title, "TEXT_MAIN");
  fillRect(r.x + 14, r.y + 31, r.w - 28, 1, "HAIRLINE");
}

function drawButton(r, label, primary, id, action) {
  const isPressed = state.pressed === id;
  fillRect(r.x, r.y, r.w, r.h, primary || isPressed ? "APP_BLUE" : "SURFACE_ALT");
  drawOutline(r, primary || isPressed ? "APP_BLUE" : "HAIRLINE");
  const x = r.x + Math.max(0, r.w - textWidth(label)) / 2;
  drawText(Math.floor(x), r.y + 8, label, "TEXT_MAIN");
  hits.push({ ...r, action: () => { flash(id); if (action) action(); } });
}

function flash(id) {
  state.pressed = id;
  render();
  setTimeout(() => { state.pressed = null; render(); }, 160);
}

// ---------- Genesis-Grundansicht ----------

function drawSecureStrip() {
  const r = L.strip;
  fillRect(r.x, r.y, r.w, r.h, "SURFACE_BG");
  fillRect(r.x, r.y + r.h - 1, r.w, 1, "HAIRLINE");
  drawText(12, 14, "raiOS / Genesis", "TEXT_MAIN");
  const right = state.recoveryOpen
    ? "Recovery context / Click to close"
    : state.wifiConnected
      ? "Core safe / Recovery ready"
      : "Core safe / Recovery available";
  drawText(r.w - textWidth(right) - 12, 14, right, "TEXT_MUTED");
  hits.push({ x: r.w - 238, y: 0, w: 238, h: 38, action: () => {
    state.recoveryOpen = !state.recoveryOpen;
    render();
  }});
}

function wrapLines(value, maxChars) {
  const out = [];
  for (const seg of value.split("\n")) {
    const chars = [...seg];
    if (chars.length === 0) { out.push(""); continue; }
    for (let i = 0; i < chars.length; i += maxChars) {
      out.push(chars.slice(i, i + maxChars).join(""));
    }
  }
  return out;
}

function conversationRows(maxChars) {
  // draw_conversation: pro Nachricht Label-Zeile + Textzeilen + Leerzeile
  const rows = [];
  for (const line of state.chat) {
    if (!line.text) continue;
    const label = line.speaker === "user" ? ["You", "APP_BLUE", "label"]
      : line.speaker === "assistant" ? ["raiOS", "TEXT_MAIN", "label"]
      : ["System", "TEXT_MUTED", "label"];
    rows.push(label);
    const bodyCol = line.speaker === "assistant" ? "TEXT_MAIN" : "TEXT_MUTED";
    for (const w of wrapLines(line.text, maxChars)) rows.push([w, bodyCol, "body"]);
    rows.push(null);
  }
  if (rows.length && rows[rows.length - 1] === null) rows.pop();
  return rows;
}

function drawConversation() {
  const r = L.conversation;
  drawPanel(r, "Conversation");
  if (state.chat.length === 0) {
    drawText(r.x + 18, r.y + 54, "Welcome. What should your raiOS become?", "TEXT_MAIN");
    drawText(r.x + 18, r.y + 74, "Ask for a tool, workflow, or a change.", "TEXT_MUTED");
    return;
  }
  const maxChars = Math.floor((r.w - 48) / ADV);
  const visible = Math.max(1, Math.floor((r.h - 54) / ROW_H));
  const rows = conversationRows(maxChars);
  const total = rows.length;
  state.chatScroll = Math.min(state.chatScroll, Math.max(0, total - visible));
  const endRow = total - state.chatScroll;
  const startRow = Math.max(0, endRow - visible);
  const contentY = r.y + 42;
  for (let i = startRow; i < endRow; i++) {
    const row = rows[i];
    if (!row) continue;
    drawText(r.x + 18, contentY + (i - startRow) * ROW_H, row[0], row[1]);
  }
  if (total > visible) {
    const trackY = r.y + 42, trackH = r.h - 54;
    const thumbH = Math.min(trackH, Math.max(12, Math.floor(trackH * visible / total)));
    const maxStart = Math.max(1, total - visible);
    const thumbY = trackY + Math.floor((trackH - thumbH) * Math.min(startRow, maxStart) / maxStart);
    fillRect(r.x + r.w - 7, trackY, 2, trackH, "HAIRLINE");
    fillRect(r.x + r.w - 8, thumbY, 4, thumbH, "APP_BLUE");
  }
}

function drawContext() {
  const r = L.context;
  drawPanel(r, state.recoveryOpen ? "Recovery context" : "Context");

  if (state.recoveryOpen) {
    // recovery.rs draw_context: Zeilen ab y+43 im 26er-Schritt, Werte sind Sim-Daten
    const maxChars = Math.floor((r.w - 28) / ADV);
    const rrows = [
      ["Posture", "Degraded", "APP_AMBER"],
      ["Current problem", "provider key missing", "APP_AMBER"],
      ["Last known good", "boot generation 41", "TEXT_MUTED"],
      ["Crashed services", "none", "TEXT_MUTED"],
      ["Disabled modules", "none", "TEXT_MUTED"],
    ];
    let ry = r.y + 43;
    for (const [label, value, col] of rrows) {
      drawText(r.x + 14, ry, label, "TEXT_MUTED");
      drawTruncated(r.x + 14, ry + 10, value, maxChars, col);
      ry += 26;
    }
    const actions = ["Restart last good", "Disable module", "Load local hash", "Rollback unavailable"];
    const firstY = r.y + r.h - 94;
    actions.forEach((label, i) => {
      drawButton({ x: r.x + 12, y: firstY + i * 20, w: r.w - 24, h: 18 }, label, false, "rec-" + i);
    });
  } else {
    drawButton({ x: r.x + 12, y: r.y + 42, w: r.w - 24, h: 24 }, "Run signed shell proof", false, "shell-proof", () => {
      pushChat("system", "Signed shell proof requested");
    });
    const rows = [
      ["AI connection", "Needs key", "APP_AMBER"],
      ["Network", state.wifiConnected ? "Ready" : "Connecting", state.wifiConnected ? "APP_GREEN" : "APP_AMBER"],
      ["Secret Vault", "Unavailable", "TEXT_MUTED"],
      ["Problems", "Critical problem present", "APP_RED"],
    ];
    let y = r.y + 78;
    const maxChars = Math.floor((r.w - 28) / ADV);
    for (const [label, value, col] of rows) {
      drawText(r.x + 14, y, label, "TEXT_MUTED");
      drawTruncated(r.x + 14, y + 11, value, maxChars, col);
      y += 31;
    }
    drawButton({ x: r.x + 12, y: r.y + r.h - 62, w: r.w - 24, h: 22 }, "AI setup", false, "ai-setup", () => openOverlay("setup"));
    drawButton({ x: r.x + 12, y: r.y + r.h - 34, w: r.w - 24, h: 22 }, "WiFi setup", true, "wifi-setup", () => startWifi());
  }
}

function drawComposer() {
  const r = L.composer;
  fillRect(r.x, r.y, r.w, r.h, "SURFACE_ALT");
  drawOutline(r, "HAIRLINE");
  const maxChars = Math.floor((r.w - 58) / ADV);
  const value = state.composerText;
  let cursorChars = 0;
  if (value.length === 0) {
    drawText(r.x + 14, r.y + 18, "Ask anything, or /build <program>...", "TEXT_FAINT");
  } else {
    const chars = [...value];
    const limit = maxChars - 1;
    if (chars.length > limit) {
      drawText(r.x + 14, r.y + 18, "<", "TEXT_FAINT");
      drawText(r.x + 14 + ADV, r.y + 18, chars.slice(chars.length - limit).join(""), "TEXT_MAIN");
      cursorChars = limit + 1;
    } else {
      drawText(r.x + 14, r.y + 18, value, "TEXT_MAIN");
      cursorChars = chars.length;
    }
  }
  state._composerCursor = { x: r.x + 14 + cursorChars * ADV, y: r.y + 15 };
  hits.push({ ...r, action: () => { state.composerFocus = true; state.cursorOn = true; present(); } });

  drawButton({ x: r.x + r.w - 38, y: r.y + 8, w: 30, h: 30 }, ">", true, "send", submitChat);
}

function pushChat(speaker, text) {
  state.chat.push({ speaker, text });
  state.chatScroll = 0;
  render();
}

function submitChat() {
  const value = state.composerText.trim();
  if (!value) return;
  state.composerText = "";
  pushChat("user", value);
  setTimeout(() => pushChat("assistant", "Ok, machen wir!"), 650);
}

// ---------- Overlays ----------

function openOverlay(view) {
  state.view = view;
  state.composerFocus = false;
  state.overlayAnim = 0;
  const steps = [0.4, 0.75, 1];
  steps.forEach((t, i) => setTimeout(() => { state.overlayAnim = t; render(); }, 40 * (i + 1)));
  render();
}

function closeOverlay() {
  state.view = "genesis";
  state.wifiSelected = null;
  state.wifiPassword = "";
  state.wifiRejected = false;
  render();
}

function overlayRect() {
  const t = state.overlayAnim;
  const o = L.overlay;
  const inset = Math.round((1 - t) * 14);
  return { x: o.x + inset, y: o.y + inset, w: o.w - 2 * inset, h: o.h - 2 * inset };
}

function drawScrim() {
  fillRect(L.personal.x, L.personal.y, L.personal.w, L.personal.h, "SCRIM");
  hits.push({ ...L.personal, action: closeOverlay });
}

function drawSetupOverlay() {
  drawScrim();
  const r = overlayRect();
  drawPanel(r, "Trusted setup");
  if (state.overlayAnim < 1) return;
  drawText(r.x + 20, r.y + 42, "Existing provider and WiFi setup", "TEXT_MUTED");
  drawText(r.x + 20, r.y + 70, "API key: unlock Secret Vault before saving", "TEXT_MAIN");
  drawButton({ x: r.x + 20, y: r.y + 104, w: r.w - 40, h: 24 }, "Secret Vault unavailable", false, "vault");
  const kbd = state.keyboardLayout === "US" ? "Keyboard: US / switch to DE" : "Keyboard: DE / switch to US";
  drawButton({ x: r.x + 20, y: r.y + 136, w: r.w - 40, h: 24 }, kbd, false, "kbd", () => {
    state.keyboardLayout = state.keyboardLayout === "US" ? "DE" : "US";
  });
  const bw = Math.floor((r.w - 52) / 2);
  const left = r.x + 20, right = left + bw + 12, first = r.y + r.h - 82;
  drawButton({ x: left,  y: first,      w: bw, h: 24 }, "Unlock Vault first", false, "api");
  drawButton({ x: right, y: first,      w: bw, h: 24 }, "Set WiFi", false, "set-wifi", startWifi);
  drawButton({ x: left,  y: first + 32, w: bw, h: 24 }, "Scan WiFi", false, "scan-wifi", startWifi);
  drawButton({ x: right, y: first + 32, w: bw, h: 24 }, "Close", false, "close-setup", closeOverlay);
}

// ---------- WiFi-Flow: exakte Geometrie aus wifi_flow.rs (zentrierte Fenster, kein Scrim) ----------

const LIST_ROW_H = 26;

function centeredRect(w, h) {
  w = Math.min(w, L.W - 24);
  h = Math.min(h, L.H - 44);
  return { x: Math.floor((L.W - w) / 2), y: Math.floor((L.H - h) / 2), w, h };
}

function blockBackground() {
  hits.push({ ...L.personal, action: () => {} });
}

function startWifi() {
  state.view = "wifi-starting";
  state.wifiProgress = 0;
  const tick = () => {
    if (state.view !== "wifi-starting") return;
    state.wifiProgress += 18;
    if (state.wifiProgress >= 100) { state.view = "wifi-list"; render(); return; }
    render();
    setTimeout(tick, 130);
  };
  render();
  setTimeout(tick, 130);
}

function drawProgressWindow(title, label) {
  blockBackground();
  const r = centeredRect(340, 126);
  drawPanel(r, title);
  drawTruncated(r.x + 20, r.y + 52, label, Math.floor((r.w - 40) / ADV), "TEXT_MAIN");
  fillRect(r.x + 20, r.y + 78, r.w - 40, 12, "SURFACE_ALT");
  fillRect(r.x + 20, r.y + 78, Math.floor((r.w - 40) * Math.min(100, state.wifiProgress) / 100), 12, "APP_BLUE");

function submitWifiPassword() {
  if (state.wifiPassword.length < 8) {
    state.wifiRejected = true;
    render();
    return;
  }
  state.view = "wifi-connecting";
  state.wifiProgress = 0;
  const tick = () => {
    if (state.view !== "wifi-connecting") return;
    state.wifiProgress += 15;
    if (state.wifiProgress >= 100) {
      state.wifiConnected = true;
      const ssid = (state.wifiNetworks[state.wifiSelected] || {}).ssid || "";
      closeOverlay();
      pushChat("system", "WiFi connected: " + ssid);
      return;
    }
    render();
    setTimeout(tick, 140);
  };
  render();
  setTimeout(tick, 140);
}

// ---------- Traum-Layout (Design-Vorschlag, unverdrahtet) ----------

const DREAM = { top: 40, bottom: 382 };

// React-artiges Layoutmodell: Jede horizontale Geometrie stammt aus diesen
// drei Keyframes. Zwischenwerte werden ausschliesslich daraus interpoliert.
const DREAM_LAYOUTS = {
  closed: {
    center: { x: 316, w: 8 },
    brackets: { left: 319, right: 321, amp: 7, hook: 0 },
    left: { x: 14, w: 286 },
    right: { x: 340, w: 288 },
  },
  ambient: {
    center: { x: 185, w: 270 },
    brackets: { left: 168, right: 470, amp: 14, hook: 7 },
    left: { x: 14, w: 128 },
    right: { x: 498, w: 130 },
  },
  open: {
    center: { x: 177, w: 286 },
    brackets: { left: 160, right: 478, amp: 16, hook: 7 },
    left: { x: 14, w: 128 },
    right: { x: 498, w: 130 },
  },
};

function lerp(a, b, t) { return a + (b - a) * t; }

function lerpDreamLayout(a, b, t) {
  return {
    center: { x: lerp(a.center.x, b.center.x, t), w: lerp(a.center.w, b.center.w, t) },
    brackets: {
      left: lerp(a.brackets.left, b.brackets.left, t),
      right: lerp(a.brackets.right, b.brackets.right, t),
      amp: lerp(a.brackets.amp, b.brackets.amp, t),
      hook: lerp(a.brackets.hook, b.brackets.hook, t),
    },
    left: { x: lerp(a.left.x, b.left.x, t), w: lerp(a.left.w, b.left.w, t) },
    right: { x: lerp(a.right.x, b.right.x, t), w: lerp(a.right.w, b.right.w, t) },
  };
}

function dreamLayout() {
  const t = Math.max(-1, Math.min(1, state.layoutT));
  return t < 0
    ? lerpDreamLayout(DREAM_LAYOUTS.closed, DREAM_LAYOUTS.ambient, t + 1)
    : lerpDreamLayout(DREAM_LAYOUTS.ambient, DREAM_LAYOUTS.open, t);
}

// Hintergrund einmalig vorrendern (Kernel wuerde das ebenso in einen Puffer
// backen): Bayer-Dithering zwischen 3 Dunkeltoenen, Mitte leicht heller,
// dazu ein deterministisches, sehr dezentes Sternenfeld.
let bgCache = null;
function buildDreamBg() {
  const c = document.createElement("canvas");
  c.width = cv.width; c.height = cv.height;
  const g = c.getContext("2d");
  const shades = ["#08090B", "#0B0D10", "#0E1014"];
  const bayer = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
  for (let y = 0; y < 400; y++) {
    const t = 1 - Math.abs(y - 210) / 240;
    for (let x = 0; x < 640; x++) {
      const cx = 1 - Math.abs(x - 320) / 420;
      const v = Math.max(0, Math.min(1, t * 0.6 + cx * 0.55)) * (shades.length - 1);
      let i = Math.floor(v);
      if (bayer[y % 4][x % 4] / 16 < v - i) i++;
      g.fillStyle = shades[Math.min(i, shades.length - 1)];
      g.fillRect(x * 2, y * 2, 2, 2);
    }
  }
  let seed = 1337;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  for (let s = 0; s < 70; s++) {
    const x = Math.floor(rnd() * 640), y = Math.floor(rnd() * 400);
    const bright = rnd() > 0.82;
    g.fillStyle = bright ? "#232833" : "#161A20";
    g.fillRect(x * 2, y * 2, 2, 2);
  }
  drawCandleInto(g);
  return c;
}

// Prozedurale Kerze als leises Hintergrund-Motiv — reine Geometrie, kein
// Bild-Asset. Scherenschnitt-Stil: EINE Farbe, Detail lebt in der Kontur.
// In physischer Aufloesung gezeichnet (1px, wie die feine Schrift) und
// einmal in den Hintergrund-Puffer gebacken (Laufzeit: 0).
function drawCandleInto(g) {
  const TONE = "#222933";
  g.fillStyle = TONE;
  const span = (x0, x1, y) => {
    if (x1 > x0) g.fillRect(Math.round(x0), Math.round(y), Math.max(1, Math.round(x1 - x0)), 1);
  };
  // Physische Koordinaten (1280x800)
  const CX = 220, BASE = 786;
  const PLATE_TOP = BASE - 24, STICK_TOP = PLATE_TOP - 58, BODY_TOP = STICK_TOP - 108;

  // Teller mit Wachs-Pfuetze: Ellipse + weiche Randbuckel
  for (let y = PLATE_TOP; y <= BASE; y++) {
    const t = (y - PLATE_TOP) / (BASE - PLATE_TOP);
    const hw = 66 * Math.sin(Math.PI * Math.min(1, t * 1.04));
    span(CX - hw, CX + hw, y);
  }
  for (const [dx, w, h] of [[-34, 16, 5], [-12, 12, 4], [22, 18, 6], [44, 10, 4]]) {
    for (let i = 0; i < h; i++) {
      const hw = (w / 2) * Math.sqrt(1 - (i / h) * (i / h));
      span(CX + dx - hw, CX + dx + hw, PLATE_TOP - i);
    }
  }

  // Gedrechselter Staender: Fussflare -> Nodus-Kugel -> Kelchflare mit Rand
  for (let y = STICK_TOP; y <= PLATE_TOP; y++) {
    const t = (y - STICK_TOP) / (PLATE_TOP - STICK_TOP); // 0 oben .. 1 unten
    let hw = 9
      + 20 * Math.pow(Math.max(0, t - 0.72) / 0.28, 1.6)          // Fussflare
      + 7 * Math.exp(-Math.pow((t - 0.45) / 0.13, 2))             // Nodus
      + 11 * Math.pow(Math.max(0, 0.16 - t) / 0.16, 1.3);         // Kelchflare
    if (t < 0.06) hw = 21;                                         // Kelchrand
    span(CX - hw, CX + hw, y);
  }

  // Kerzenkoerper: organisch geschmolzene Kontur — Detail lebt an der KANTE
  // (seitliche Wachs-Wuelste als lange weiche Ausbuchtungen)
  const edge = (y) => 14
    + 2.6 * Math.sin(y * 0.05) + 1.6 * Math.sin(y * 0.12 + 1.7)
    + 3.5 * Math.exp(-Math.pow((y - (BODY_TOP + 46)) / 18, 2));
  for (let y = BODY_TOP; y <= STICK_TOP; y++) {
    let hw = edge(y);
    const top = y - BODY_TOP;
    if (top < 12) hw += 7 * Math.sin(Math.PI * top / 12) * (1 + 0.35 * Math.sin(y * 0.8)); // Schmelzrand-Ueberhang
    span(CX - hw, CX + hw, y);
  }

  // Tropfnasen AUSSEN an der Kontur: haengen sichtbar unter dem Schmelzrand,
  // mit runden Tropfen-Spitzen
  const drips = [
    [-20, 5, 30], [-24, 4, 16], [19, 6, 72], [23, 5, 38],
  ];
  for (const [dx, w, len] of drips) {
    for (let i = 0; i < len; i++) {
      const t = i / len;
      let hw = (w / 2) * (0.75 + 0.25 * Math.sin(i * 0.25));
      if (t > 0.82) hw = (w / 2) * Math.sqrt(Math.max(0, 1 - Math.pow((t - 0.82) / 0.18, 2))) * 1.15;
      span(CX + dx - hw, CX + dx + hw, BODY_TOP + 6 + i);
    }
  }
  // eine lange Nase ueber den Kelchrand bis fast zum Teller
  for (let i = 0; i < 48; i++) {
    const t = i / 48;
    let hw = 3.4 * (0.8 + 0.2 * Math.sin(i * 0.3));
    if (t > 0.8) hw = 4.2 * Math.sqrt(Math.max(0, 1 - Math.pow((t - 0.8) / 0.2, 2)));
    span(CX - 19 - hw, CX - 19 + hw, STICK_TOP + 2 + i);
  }

  // Docht: kurz sichtbar zwischen Kerze und Flamme
  for (let i = 0; i < 9; i++) span(CX + Math.round(i * 0.22) - 1, CX + Math.round(i * 0.22) + 1, BODY_TOP - i);

  // Flamme: schlanke, spitze Traene mit leichtem S-Schwung, Luecke zum Docht
  const FTOP = BODY_TOP - 68;
  for (let y = FTOP; y <= BODY_TOP - 12; y++) {
    const t = (y - FTOP) / (BODY_TOP - 12 - FTOP);   // 0 Spitze .. 1 Basis
    const hw = 7.2 * Math.sin(Math.PI * Math.pow(t, 0.55)) * (1 - 0.1 * Math.sin(3 * t));
    const lean = 3.5 * Math.sin(Math.PI * t) * (t - 0.45);
    span(CX + lean - hw, CX + lean + hw, y);
  }

  // Halo: duenner glatter Ring um die Flamme
  const HCX = CX, HCY = FTOP + 34, HR = 44;
  for (let a = 0; a < 360; a += 0.6) {
    const r = a * Math.PI / 180;
    g.fillRect(Math.round(HCX + HR * Math.cos(r)), Math.round(HCY + HR * Math.sin(r)), 1, 1);
    g.fillRect(Math.round(HCX + (HR - 1) * Math.cos(r)), Math.round(HCY + (HR - 1) * Math.sin(r)), 1, 1);
  }

  // Henkel: glatter dicker Ring rechts + S-Verbindung zum Staender
  const GX = CX + 74, GY = PLATE_TOP - 28, GR = 26;
  for (let a = 0; a < 360; a += 0.5) {
    const r = a * Math.PI / 180;
    for (let rr = GR - 4; rr <= GR; rr++) {
      g.fillRect(Math.round(GX + rr * Math.cos(r)), Math.round(GY + rr * Math.sin(r)), 1, 1);
    }
  }
  for (let x = CX + 18; x <= GX - GR + 4; x++) {
    const t = (x - CX - 18) / (GX - GR + 4 - CX - 18);
    const y = PLATE_TOP - 38 + 10 * Math.sin(Math.PI * t - Math.PI / 2);
    span(x, x + 1, y); span(x, x + 1, y + 1); span(x, x + 1, y + 2); span(x, x + 1, y + 3);
  }
}

let layoutAnimTimer = null;
// Ease-in-out (kubisch), zeitbasiert und bildschirm-synchron:
// requestAnimationFrame liefert einen Frame pro Display-Refresh, die
// Position kommt aus der verstrichenen Zeit — kein Timer-Jitter mehr.
// (Kernel-Aequivalent: Tick-getriebene Frames, Position = f(uptime).)
function easeInOut(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

const LAYOUT_ANIM_MS = 500;
function animateLayout(goal) {
  goal = Math.max(-1, Math.min(1, goal));
  state.layoutGoal = goal;
  if (layoutAnimTimer) cancelAnimationFrame(layoutAnimTimer);
  const start = state.layoutT;
  const t0 = performance.now();
  const step = (now) => {
    const t = Math.min(1, (now - t0) / LAYOUT_ANIM_MS);
    state.layoutT = lerp(start, goal, easeInOut(t));
    render();
    if (t < 1) layoutAnimTimer = requestAnimationFrame(step);
    else layoutAnimTimer = null;
  };
  layoutAnimTimer = requestAnimationFrame(step);
}

function drawBracket(xc, dir, amp, hook) {
  // Physische 1px-Praezision: waehrend der Transition gleiten die Boegen in
  // halben Logik-Pixeln statt in 2px-Spruengen — das nimmt das Stufige.
  hook = Math.round(hook);
  for (let y = DREAM.top; y <= DREAM.bottom; y++) {
    const t = (y - DREAM.top) / (DREAM.bottom - DREAM.top);
    const s = Math.sin(Math.PI * t);
    const x = xc + dir * amp * s;
    const w = s > 0.85 ? 3 : 2;
    const core = s > 0.92 ? "#5E7089" : s > 0.55 ? "#4A5568" : "#3E434C";
    const px = Math.round(x * 2), py = y * 2;
    target.fillStyle = "#151A21";
    target.fillRect(px - 2, py, w * 2 + 4, 2);
    target.fillStyle = core;
    target.fillRect(px, py, w * 2, 2);
  }
  xc = Math.round(xc);
  // Endhaken: kleine horizontale Abschluesse Richtung Mitte
  fillRect(xc - (dir > 0 ? hook - 1 : 0), DREAM.top, hook, 1, "#3E434C");
  fillRect(xc - (dir > 0 ? hook - 1 : 0), DREAM.bottom, hook, 1, "#3E434C");
}

function addBracketHits(xc, dir, amp) {
  // Kurvennahe Trefferstreifen statt eines grossen unsichtbaren Rechtecks.
  for (let y = DREAM.top; y <= DREAM.bottom; y += 8) {
    const t = (y - DREAM.top) / (DREAM.bottom - DREAM.top);
    const x = Math.round(xc + dir * amp * Math.sin(Math.PI * t));
    hits.push({ x: x - 18, y: y - 4, w: 37, h: 12, action: () => {
      state.hoverCenter = false;
      animateLayout(state.layoutGoal === -1 || state.layoutT < -0.5 ? 0 : -1);
    }});
  }
}

function railHeader(x, y, label) {
  drawText(x, y, label, "#5C6470");
  fillRect(x, y + 10, textWidth(label), 1, "#20252D");
}

function drawDiamond(x, y, col) {
  fillRect(x + 2, y, 1, 1, col);
  fillRect(x + 1, y + 1, 3, 1, col);
  fillRect(x, y + 2, 5, 1, col);
  fillRect(x + 1, y + 3, 3, 1, col);
  fillRect(x + 2, y + 4, 1, 1, col);
}

function segBar(x, y, w, pct, fill, light) {
  fillRect(x, y, w, 8, "#0D0F13");
  fillRect(x + 1, y + 1, w - 2, 1, "#07090B");
  drawOutline({ x, y, w, h: 8 }, "#1E232B");
  const filled = Math.round(12 * Math.min(100, pct) / 100);
  for (let i = 0; i < filled; i++) {
    const sx = x + 2 + i * 9;
    fillRect(sx, y + 2, 8, 4, fill);
    fillRect(sx, y + 2, 8, 1, light);
  }
}

// ---------- Hover-System: pro Button ein weicher 4-Frame-Aufwaerts-Fade ----------

function hoverAmount(id) {
  return state.hoverId === id ? state.hoverT : 0;
}

let hoverAnimTimer = null;
function animateHover() {
  if (hoverAnimTimer) clearTimeout(hoverAnimTimer);
  state.hoverT = 0;
  let frame = 0;
  const step = () => {
    frame++;
    state.hoverT = easeInOut(Math.min(1, frame / 4));
    render();
    if (frame < 4) hoverAnimTimer = setTimeout(step, 30);
    else hoverAnimTimer = null;
  };
  step();
}

// Zeitlose Andeutungs-Buttons: kein Kasten. Ruhend nur Label + feine
// Grundlinie; bei Hover waechst mittig eine blaue Linie und das Label hellt
// auf. Primaer traegt ruhend blaues Label + blaue Grundlinie.
// EINHEIT (Owner): alle Buttons 130x16, Text immer in der feinen Stufe.
const BTN_W = 130, BTN_H = 16;
function ghostButton(x, y, wIgnored, label, id, action, mode) {
  const w = BTN_W, hi = true;
  const r = { x, y, w, h: BTN_H };
  const tw = Math.ceil([...label].length * 4.5);
  const tx = x + Math.max(0, Math.floor((w - tw) / 2));
  const draw = drawTextHi;
  const ty = y + 4;
  if (mode === "disabled") {
    draw(tx, ty, label, "#454D5A");
    fillRect(x, y + 15, w, 1, "#1A1F26");
    return;
  }
  const hov = hoverAmount(id);
  const pressed = state.pressed === id;
  const primary = mode === "primary";
  if (pressed) fillRect(x, y, w, 16, "#2E5C94");
  else if (hov > 0) fillRect(x, y, w, 16, primary ? "#14273D" : "#12161C");
  draw(tx, ty, label, pressed || hov > 0 ? "TEXT_MAIN" : primary ? "#7CB3F5" : "TEXT_MUTED");
  fillRect(x, y + 15, w, 1, primary ? "#2E5C94" : "#20252D");
  const uw = Math.round(w * hov);
  if (uw > 0) fillRect(x + Math.floor((w - uw) / 2), y + 15, uw, primary ? 2 : 1, "APP_BLUE");
  hits.push({ ...r, id, action: () => { flash(id); if (action) action(); } });
}

function railButton(x, y, w, label, id, action, mode) { ghostButton(x, y, w, label, id, action, mode); }
function railButtonHi(x, y, w, label, id, action, mode) { ghostButton(x, y, w, label, id, action, mode); }

// Programm-Zeile mit Hover: Pfeil faerbt sich blau, Linie waechst unter dem Label
function ghostItem(x, y, w, label, id, hi) {
  const hov = hoverAmount(id);
  const draw = hi ? drawTextHi : drawText;
  draw(x, y, ">", hov > 0 ? "APP_BLUE" : "#454D5A");
  draw(x + 12, y, label, "TEXT_MAIN");

function segBarWide(x, y, w, pct, fill, light) {
  fillRect(x, y, w, 8, "#0D0F13");

  drawOutline({ x, y, w, h: 8 }, "#1E232B");
  const filled = Math.round(12 * Math.min(100, pct) / 100);
  const slot = Math.max(2, Math.floor((w - 4) / 12));
  for (let i = 0; i < filled; i++) {
    const sx = x + 2 + i * slot;
    fillRect(sx, y + 2, Math.max(1, slot - 1), 4, fill);
    fillRect(sx, y + 2, Math.max(1, slot - 1), 1, light);
  }

    y += 8;
    drawText(cx0, y, state.approved ? "running in own domain" : "artifact inert until click", state.approved ? "APP_GREEN" : "APP_AMBER");
  }

  }

  // Inhalte wechseln an einer klaren Schwelle; die Geometrie selbst bleibt
  // waehrend der gesamten Transition kontinuierlich interpoliert.
  if (state.layoutT < -0.5) drawClosedRails(left, right);
  else if (state.layoutT > -0.5) drawAmbientRails(left, right);

  // Hover-Modell: die Klammern selbst sind keine Klickziele mehr — die Mitte
  // oeffnet sich beim Beruehren mit dem Zeiger und schliesst sich beim Verlassen.
}

// ---------- Render ----------

// Teurer Pfad: komplette Szene in den Back-Buffer (Kernel: render_inner).
function renderScene() {
  hits = [];
  target = bctx;
  if (state.dream) { drawDream(); return; }
  fillRect(0, 0, L.W, L.H, "APP_BG");
  drawSecureStrip();
  drawConversation();
  drawContext();
  drawComposer();
  if (state.view === "setup") drawSetupOverlay();
  else if (state.view === "wifi-starting") drawWifiStarting();
  else if (state.view === "wifi-list") drawWifiList();
  else if (state.view === "wifi-password") drawWifiPassword();
  else if (state.view === "wifi-connecting") drawWifiConnecting();
}

// Billiger Pfad: Back-Buffer blitten + Front-Pixel (Kernel: set_front_pixel /
// restore_from_back_rect) — Cursorblinken zeichnet die Szene NICHT neu.
function present() {
  ctx.drawImage(back, 0, 0);
  target = ctx;
  if (state.view === "genesis" && state.composerFocus && state.cursorOn && state._composerCursor) {
    fillRect(state._composerCursor.x, state._composerCursor.y, 2, 15, "APP_BLUE");
  }
  if (state.view === "wifi-password" && state.cursorOn && state._pwCursor) {
    fillRect(state._pwCursor.x, state._pwCursor.y, 2, 15, "APP_BLUE");
  }
  // raiOS-Mauszeiger: Front-Ebene, Fuellung blau bei gedruecktem Knopf
  if (state.pointer) {
    const fill = state.pointerDown ? PAL.APP_BLUE : PAL.TEXT_MAIN;
    for (let row = 0; row < POINTER_SHAPE.length; row++) {
      const pattern = POINTER_SHAPE[row];
      for (let col = 0; col < pattern.length; col++) {
        const px = pattern[col];
        if (px !== "X" && px !== "O") continue;
        ctx.fillStyle = px === "X" ? POINTER_OUTLINE : fill;
        ctx.fillRect(state.pointer.x + col * SCALE, state.pointer.y + row * SCALE, SCALE, SCALE);
      }
    }
  }
  target = bctx;
}

function render() {
  renderScene();
  present();
}

function toLogical(ev) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.floor((ev.clientX - r.left) / r.width * L.W),
    y: Math.floor((ev.clientY - r.top) / r.height * L.H),
  };
}

function hitAt(p) {
  for (let i = hits.length - 1; i >= 0; i--) {
    const h = hits[i];
    if (p.x >= h.x && p.x < h.x + h.w && p.y >= h.y && p.y < h.y + h.h) return h;
  }
  return null;
}

cv.addEventListener("click", (ev) => {
  cv.focus();
  const h = hitAt(toLogical(ev));
  const wasFocus = state.composerFocus;
  if (h) {
    h.action();
  } else if (wasFocus) {
    state.composerFocus = false;
    render();
  }
});

function toPhysical(ev) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.floor((ev.clientX - r.left) / r.width * cv.width),
    y: Math.floor((ev.clientY - r.top) / r.height * cv.height),
  };
}

// Zeigerbewegung = nur Front-Ebene neu (billiger Pfad, wie im Kernel)
cv.addEventListener("mousemove", (ev) => {
  state.pointer = toPhysical(ev);
  if (state.dream) {
    // Reines Hover-Modell: Mitte beruehren = aufziehen, sonst geschlossen.
    // Die Zone folgt dem interpolierten Layout (Hysterese durch +-20).
    const p = toLogical(ev);
    const lay = dreamLayout();
    const inC = p.x >= lay.center.x - 20 && p.x <= lay.center.x + lay.center.w + 20 && p.y >= DREAM.top && p.y <= DREAM.bottom;
    const goal = inC ? 1 : -1;
    state.hoverCenter = inC;
    if (goal !== state.layoutGoal) animateLayout(goal);
    // Button-Hover: weicher Fade beim Betreten, sofortiges Zuruecksetzen beim Verlassen
    const hh = hitAt(p);
    const hid = hh && hh.id ? hh.id : null;
    if (hid !== state.hoverId) {
      state.hoverId = hid;
      if (hid) animateHover();
      else { state.hoverT = 0; render(); }
    }
  }
  present();
});
cv.addEventListener("mouseleave", () => {
  state.pointer = null;
  if (state.dream && state.layoutGoal !== -1) {
    state.hoverCenter = false;
    animateLayout(-1);
  }
  present();
});
cv.addEventListener("mousedown", () => { state.pointerDown = true; present(); });
cv.addEventListener("mouseup", () => { state.pointerDown = false; present(); });

cv.addEventListener("wheel", (ev) => {
  const p = toLogical(ev);
  if (state.dream) {
    const layout = dreamLayout();
    if (state.layoutT > -0.5 && state.dreamTab === "chat" && p.x >= layout.center.x && p.x < layout.center.x + layout.center.w && p.y >= 70 && p.y < 340) {
      ev.preventDefault();
      state.chatScroll = Math.max(0, state.chatScroll + (ev.deltaY < 0 ? 2 : -2));
      render();
    }
    return;
  }
  const r = L.conversation;
  if (state.view === "genesis" && p.x >= r.x && p.x < r.x + r.w && p.y >= r.y && p.y < r.y + r.h) {
    ev.preventDefault();
    state.chatScroll = Math.max(0, state.chatScroll + (ev.deltaY < 0 ? 2 : -2));
    render();
  }
}, { passive: false });

cv.addEventListener("keydown", (ev) => {
  if (ev.ctrlKey && ev.shiftKey && ev.key.toLowerCase() === "e") {
    exportDesignDelta();
    ev.preventDefault();
    return;
  }
  if (state.dream && ev.key === "Escape" && state.layoutGoal !== -1) {
    state.hoverCenter = false;
    animateLayout(-1);
    ev.preventDefault();
    return;
  }
  if (state.view === "wifi-password") {
    if (ev.key === "Backspace") state.wifiPassword = state.wifiPassword.slice(0, -1);
    else if (ev.key === "Escape") { state.view = "wifi-list"; }
    else if (ev.key === "Enter") { submitWifiPassword(); ev.preventDefault(); return; }
    else if (ev.key.length === 1 && state.wifiPassword.length < 63) state.wifiPassword += ev.key;
    else return;
    ev.preventDefault();
    render();
    return;
  }
  if (state.view !== "genesis" && ev.key === "Escape") { closeOverlay(); return; }
  if (!state.composerFocus) return;
  if (ev.key === "Backspace") {
    state.composerText = state.composerText.slice(0, -1);
  } else if (ev.key === "Escape") {
    state.composerFocus = false;
  } else if (ev.key === "Enter") {
    flash("send");
    submitChat();
    return;
  } else if (ev.key.length === 1) {
    state.composerText += ev.key;
  } else {
    return;
  }
  ev.preventDefault();
  render();
});

setInterval(() => {
  state.cursorOn = !state.cursorOn;
  // Blinken = nur Front-Ebene, Szene bleibt unberuehrt (billig)
  if (state.composerFocus || state.view === "wifi-password") present();
  // Sim: Doppel-Bau Lauf B tickt (Szene-Redraw = ehrlich teuer)
  if (state.dream && !state.approved && state.buildB < 100) {
    state.buildB = Math.min(100, state.buildB + 6);
    render();
  }
}, 530);

// Deterministische Start-Zustaende fuer Screenshot-Automation:
// ?view=setup|wifi-starting|wifi-list|wifi-password|wifi-connecting
// &recovery=1 &wifi=connected &chat=demo &pw=<text> &progress=<0-100> &focus=1
// &layout=closed|open (Traum-Layout sofort auf den Screenshot-Keyframe setzen)
const params = new URLSearchParams(location.search);
if (params.get("classic") === "1" || params.get("dream") === "0") state.dream = false;
if (params.get("tab")) state.dreamTab = params.get("tab");
if (params.get("built") === "1") state.buildB = 100;
if (params.get("approved") === "1") { state.buildB = 100; state.approved = true; }
if (params.get("expand") === "1") { state.layoutT = 1; state.layoutGoal = 1; state.hoverCenter = true; }
if (params.get("layout") === "closed") { state.layoutT = -1; state.layoutGoal = -1; state.hoverCenter = false; }
else if (params.get("layout") === "open") { state.layoutT = 1; state.layoutGoal = 1; state.hoverCenter = true; }
if (params.get("view")) { state.view = params.get("view"); state.dream = false; }
// Testhilfe: synthetischer Klick auf den linken Bogen durch die echte Event-Kette
if (params.get("clicktest") === "toggle") {
  setTimeout(() => {
    const r = cv.getBoundingClientRect();
    cv.dispatchEvent(new MouseEvent("click", {
      clientX: r.left + 320 / L.W * r.width,
      clientY: r.top + 18 / L.H * r.height,
      bubbles: true,
    }));
  }, 400);
}
if (params.get("clicktest") === "bracket") {
  setTimeout(() => {
    const r = cv.getBoundingClientRect();
    const lay = dreamLayout();
    const bx = lay.brackets.left - lay.brackets.amp * Math.sin(Math.PI * 0.5);
    cv.dispatchEvent(new MouseEvent("click", {
      clientX: r.left + (bx + 1) / L.W * r.width,
      clientY: r.top + 220 / L.H * r.height,
      bubbles: true,
    }));
  }, 400);
}
if (params.get("recovery") === "1") state.recoveryOpen = true;
if (params.get("wifi") === "connected") state.wifiConnected = true;
if (params.get("chat") === "demo") {
  state.chat = [
    { speaker: "user", text: "Build me a small paint tool" },
    { speaker: "assistant", text: "Ok, machen wir!" },
    { speaker: "system", text: "Signed shell proof requested" },
  ];
}
if (state.view.startsWith("wifi-") && state.wifiSelected === null) state.wifiSelected = 0;
if (params.get("pw")) state.wifiPassword = params.get("pw");
if (params.get("progress")) state.wifiProgress = parseInt(params.get("progress"), 10) || 0;
if (params.get("focus") === "1") state.composerFocus = true;

render();
</script>
