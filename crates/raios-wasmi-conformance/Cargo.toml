[package]
name = "raios-wasmi-conformance"
version = "0.1.0"
edition = "2021"
publish = false

# Host-side conformance tests for the vendored wasmi engine (threads/T-family).
# The `wasmi` dependency resolves to vendor/wasmi-0.31.2 via the workspace
# [patch.crates-io] table; `wat` compiles test modules from text.

[dependencies]
wasmi = "0.31.2"

[dev-dependencies]
wat = "=1.219.1"
