[package]
name = "raios-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes"] }
embedded-io = { version = "=0.6.1", default-features = false }
hkdf = { version = "=0.12.4", default-features = false }
# NO `pkcs8`: it pulls der/base64ct (+PEM) into the permanent core. SPKI parsing
# is raios-x509-spki's job (no-dep, host-tested); p256 only does the math here.
p256 = { version = "0.13.2", default-features = false, features = ["ecdh", "ecdsa"] }
raios-dns-parse = { path = "../raios-dns-parse" }
raios-http-parse = { path = "../raios-http-parse" }
raios-x509-spki = { path = "../raios-x509-spki" }
raios-x509-time = { path = "../raios-x509-time" }
sha2 = { version = "0.10.9", default-features = false }
zeroize = { version = "=1.8.2", default-features = false }
