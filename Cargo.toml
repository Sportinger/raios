smallvec = { path = "vendor/smallvec-1.15.1" }
spin = { path = "vendor/spin-0.9.8" }
wasmi = { path = "vendor/wasmi-0.31.2" }
wasmi_arena = { path = "vendor/wasmi_arena-0.4.1" }
