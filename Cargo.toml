[workspace]
members = [
    "ota/cli",
    "registry/cli",
    "registry/core",
    "fake-cloud/server",
    "raios-core",
    "seed-kernel",
    "wasm-guests/svc-demo-echo"
]
resolver = "2"

[patch.crates-io]
autocfg = { path = "vendor/autocfg-1.5.1" }
